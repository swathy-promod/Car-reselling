{% extends 'Guest/Header.html' %}
{% block content %}

<style>
    body{
        background-color:#f4f6f9;
        font-family: Arial, sans-serif;
    }

    .form-container{
        width:400px;
        margin:120px auto;
        background:#fff;
        padding:30px;
        border-radius:15px;
        box-shadow:0px 4px 15px rgba(0,0,0,0.2);
    }

    .form-container h2{
        text-align:center;
        color:#333;
        margin-bottom:20px;
    }

    .input-box{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
        margin-top:5px;
        margin-bottom:15px;
        font-size:16px;
    }

    .btn-send{
        width:100%;
        padding:12px;
        background:#007bff;
        color:white;
        border:none;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    .btn-send:hover{
        background:#0056b3;
    }
</style>

<div class="form-container">
    <h2>Forgot Password</h2>

    <form action="" method="post">
        {% csrf_token %}
        
        <label>Email Address</label>
        <input type="email" name="txt_email" class="input-box" placeholder="Enter your email" required>

        <input type="submit" value="Send OTP" class="btn-send">
    </form>
</div>

{% if msg %}
<script>
    alert("OTP is sent to {{msg}}");
    window.location = "{% url 'Guest:otp' %}";
</script>
{% endif %}

{% endblock %}
