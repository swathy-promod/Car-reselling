{% extends 'Guest/Header.html' %}
{% block content %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New User</title>
    <style>
    body {
        background: #f4f6f9;
        /* font-family: Arial, sans-serif; */
    }

    .register-container {
        width: 600px;
        margin: 40px auto;
    }

    .register-title {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        background: #ffffff;
        border-collapse: collapse;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
        border: none;
    }

    td {
        padding: 12px;
    }

    tr:nth-child(even) {
        background: #f8f9fa;
    }

    td:first-child {
        font-weight: bold;
        color: #333;
        width: 30%;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="file"],
    select,
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 5px;
        box-sizing: border-box;
    }

    textarea {
        resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0px 0px 5px rgba(0,123,255,0.3);
    }

    .gender-group input[type="radio"] {
        width: auto;
        margin-right: 5px;
    }

    input[type="submit"] {
        background: #28a745;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
    }

    input[type="submit"]:hover {
        background: #218838;
    }

    input[type="reset"] {
        background: #dc3545;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
    }

    input[type="reset"]:hover {
        background: #c82333;
    }
</style>
    
</head>

<body>
    <form method="POST" enctype="multipart/form-data" class="register-container">
        {% csrf_token %}
        <table border="2px">
            
            <tr>
                <td class="register-title">Name</td>
                <td><input type="text" name="txt_name" required placeholder="Enter The Name" minlength="3" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$"></td>
            </tr>
            <tr>
                <td class="register-title">Gender</td>
                <td><input type="radio" name="rd_gender" name="male" required>Male
                <input type="radio" name="rd_gender" name="female">Female</td>
            </tr>
            <tr>
                <td class="register-title">Contact</td>
                <td><input type="text" name="txt_contact" required placeholder="Enter The Contact" minlength="10" maxlength="10"></td>
            </tr>
            <tr>
                <td class="register-title">Email</td>
                <td><input type="email" name="txt_email" required placeholder="Enter The Email"></td>
            </tr>
            
            <tr>
                <td class="register-title">District</td>
                <td> <select name="sel_district" id="sel_district" required>
                    <option value="">--select--</option>
                    {% for i in district %}
                    <option value="{{i.id}}">
                    {{i.district_name}}</option>
                    {% endfor %}
                        
                        

                    </select>
                </td>
            </tr>
            <tr>
                <td class="register-title">Place</td>
                <td><select name="sel_place" id="sel_place" required>
                    <option value="">--select--</option>
                    
                    
                </select></td>
            </tr>
            <tr>
                <td class="register-title">Address</td>
                <td><textarea name="txt_address" rows="3"cols="20" required placeholder="Enter The Address"></textarea></td>
            </tr>
            <tr>
                <td class="register-title">Photo</td>
                <td><input type="file" name="file_photo" required accept="image/*"></td>
            </tr>
            <tr>
                <td class="register-title">Proof</td>
                <td><input type="file" name="file_proof" required accept="image/*"></td>
            </tr>
            <tr>
                <td class="register-title">Password</td>
                <td><input type="password" name="txt_psw" required placeholder="Enter The Password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td class="register-title" colspan="2" align="center">
                    <input type="submit" name="btn_submit">
                    <input type="reset" name="btn_cancel">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#sel_district").change(function () 
    {
        var did = $(this).val();
        var ur = "{% url 'Guest:ajaxplace' %}"
        $.ajax({
            url: ur,
            data: { did: did, },
            success: function (data) {
                $("#sel_place").html(data);
            },
        });
    });
</script>

{% endblock %}
