<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankList</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <table border="2px">
            <tr>
                <td>First Name</td>
                <td><input type="text" name="txt_fname"></td>
            </tr>
            <tr>
                <td>Last Name </td>
                <td><input type="text" name="txt_lname"></td>
            </tr>
            <tr>
                <td>RollNo</td>
                <td><input type="text" name="txt_rollno"></td>
            </tr>
            <tr>
                <td>Deparment</td>
                <td><select name="sel_dep">
                    <option value="sel">--select--</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="Bcom">Bcom</option>

                </select></td>
            </tr>
            <tr>
                <td>Sem</td>
                <td><select name="sel_sem">
                    <option value="sel">--select--</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>

                </select></td>
            </tr>
            <tr>
                <td>Mark 1</td>
                <td><input type="number" name="num_mar1"></td>
            </tr>
            <tr>
                <td>Mark 2</td>
                <td><input type="number" name="num_mar2"></td>
            </tr>
            <tr>
                <td>Mark 3</td>
                <td><input type="number" name="num_mar3"></td>
            </tr>
           
            <tr>
                <td colspan="2" align="center"><input type="submit" name="btn_submit"></td>
            </tr>
        </table>
    </form>
    <table border="2px">
        <tr>
            <td>Full Name</td>
            <td>{{fullname}}</td>
        </tr>
          <tr>
             <td>RollNo</td>
            <td>{{rollno}}</td>
        </tr>
        <tr>
            <td>Department </td>
            <td>{{dep}}</td>
        </tr>
        <tr>
            <td>sem</td>
            <td>{{sem}}</td>
        </tr>
        <tr>
            <td>t_mark</td>
            <td>{{t_mark}}</td>
        </tr>
        <tr>
            <td>Grade</td>
            <td>{{grade}}</td>
        </tr>
    </table>
</body>
</html>
