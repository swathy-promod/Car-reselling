{% extends 'Dealer/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        /* padding: 20px; */
    }

    form {
        max-width: 600px;
        margin: auto;
        background: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }

    table td {
        padding: 12px;
        border: 1px solid #ddd;
    }

    input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.3s;
    }

    input[type="password"]:focus {
        border-color: #007bff;
    }

    input[type="submit"], input[type="reset"] {
        background: #007bff;
        color: #fff;
        border: none;
        padding: 10px 20px;
        margin: 5px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.3s;
    }

    input[type="reset"] {
        background: #6c757d;
    }

    input[type="submit"]:hover {
        background: #0056b3;
    }

    input[type="reset"]:hover {
        background: #5a6268;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }
</style>

    
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <table border="2px">
            <tr>
                <td>Old Password</td>
                <td><input type="password" name="txt_oldpsw" required placeholder="Enter Old Password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td>New Password</td>
                <td><input type="password" name="txt_newpsw" required placeholder="Enter New Password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td>Retype Password</td>
                <td><input type="password" name="txt_retypepsw" required placeholder="Enter Retype Password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" name="btn_submit" value="Change Password">
                    <input type="reset" name="btn_cancel" value="Cancel">
                </td>
            </tr>
        </table>
    </form>
    
</body>
</html>
{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Dealer:ChangePassword' %}"
</script>
{% endif %}

{% endblock content %}
