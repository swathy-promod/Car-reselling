{% extends 'Adminstrator/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 20px;
    }

    form {
        max-width: 700px;
        margin: auto;
        background: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }

    table th, table td {
        padding: 12px;
        text-align: left;
        border: 1px solid #ddd;
    }

    table tr:nth-child(even) {
        background: #f9f9f9;
    }

    table tr:hover {
        background: #f1f1f1;
    }

    input[type="text"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.3s;
    }

    input[type="text"]:focus {
        border-color: #007bff;
    }

    input[type="submit"], input[type="reset"] {
        background: #007bff;
        color: #fff;
        border: none;
        padding: 10px 20px;
        margin: 5px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.3s;
    }

    input[type="reset"] {
        background: #6c757d;
    }

    input[type="submit"]:hover {
        background: #0056b3;
    }

    input[type="reset"]:hover {
        background: #5a6268;
    }

    .hga {
        text-decoration: none;
        color: #007bff;
        margin-right: 10px;
        padding: 6px 12px;
        border: 1px solid #007bff;
        border-radius: 4px;
        transition: all 0.3s;
    }

    .hga:hover {
        background: #007bff;
        color: #fff;
    }

    h1, h2 {
        text-align: center;
        color: #333;
    }
</style>

</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <table border="2px">
            <tr>
                <td>District Name</td>
                <td><input type="text"name="txt_district" value="{{editdata.district_name}}"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" name="btn_Submit">
                <input type="reset" name="btn_cancel"</td>
            </tr>
        </table>
        <table border="2px">
            <tr>
                <td>SINO</td>
                <td>District</td>
                <td>Action</td>
            </tr>
            {% for i in district %}
            <tr>
                <td>{{ forloop.counter}}</td>
                <td>{{ i.district_name}}</td>
                <td><a class="hga" href="{% url 'Admin:districtdelete' i.id %}">Delete</a>
                <a class="hga" href="{% url 'Admin:districtedit' i.id %}">Edit</a></td>
            </tr>
            {% endfor %}
        </table>
    </form>
</body>
</html>
{% endblock content %}
