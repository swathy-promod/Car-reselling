{% extends 'Adminstrator/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        .title {
            background: #007bff;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 5px 5px 0 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        td, th {
            border: 1px solid #ddd;
            padding: 12px;
        }

        th {
            background: #007bff;
            color: white;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #218838;
        }

        input[type="reset"] {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        input[type="reset"]:hover {
            background: #c82333;
        }

        .btn-edit {
            background: #007bff;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 5px;
        }

        .btn-edit:hover,
        .btn-delete:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="title">Company Management</div>

        <form method="POST">
            {% csrf_token %}

            <!-- Form Table -->
            <table>
                <tr>
                    <td width="30%">Company Name</td>
                    <td>
                        <input type="text" name="txt_company"
                               value="{{editdata.company_name}}">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Cancel">
                    </td>
                </tr>
            </table>

            <!-- Data Table -->
            <table>
                <tr>
                    <th>SINO</th>
                    <th>Company</th>
                    <th>Action</th>
                </tr>

                {% for i in company %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ i.company_name }}</td>
                    <td>
                        <a href="{% url 'Admin:companydelete' i.id %}"
                           class="btn-delete">Delete</a>

                        <a href="{% url 'Admin:companyedit' i.id %}"
                           class="btn-edit">Edit</a>
                    </td>
                </tr>
                {% endfor %}

            </table>
        </form>

    </div>
</body>
</html>
{% endblock content %}
