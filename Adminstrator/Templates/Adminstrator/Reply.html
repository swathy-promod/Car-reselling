{% extends 'Adminstrator/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reply</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 20px;
    }

    form {
        max-width: 700px;
        margin: auto;
        background: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }

    table th, table td {
        padding: 12px;
        text-align: left;
        border: 1px solid #ddd;
    }

    table tr:nth-child(even) {
        background: #f9f9f9;
    }

    table tr:hover {
        background: #f1f1f1;
    }

    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        resize: vertical;
        outline: none;
        transition: border-color 0.3s;
    }

    textarea:focus {
        border-color: #007bff;
    }

    input[type="submit"] {
        background: #007bff;
        color: #fff;
        border: none;
        padding: 10px 20px;
        margin: 5px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.3s;
    }

    input[type="submit"]:hover {
        background: #0056b3;
    }

    h3 {
        text-align: center;
        color: #333;
        margin-bottom: 15px;
    }
</style>

</head>
<body>
     <form method="post">
        {% csrf_token %}
        <table align="center" border="1">
            
            <tr>
                 <td>Reply</td>
                <td>
                  <textarea  name="txt_rp" ></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    
                    <input type="submit" name="btn_submit" value="Submit">
              </td>
             
            </tr>
        </table>
        <table border="1" align="center">
           
            <h3 align="center"></h3>
            <tr>
                <td>SlNo</td>
                <td>Reply</td>
                
            </tr>
            {% for i in reply %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.reply_reply}}</td>
               
            </tr>
         </table>
         {% endfor %}
     </form>
</body>
</html>
{% endblock content %}
