{% extends 'User/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
</head>

<body>
    <form method="POST">
        {% csrf_token %}
    <table border="2px">
        <tr>
            <td>Name</td>
            <td><input type="text" name="txt_name" value="{{user.user_name}}"></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input type="text" name="txt_email" value="{{user.user_email}}"></td>
        </tr>
        <tr>
            <td>Contact</td>
            <td><input type="text" name="txt_contact" value="{{user.user_contact}}"></td>
        </tr>
        <tr>
            <td>Address</td>
            <td><textarea name="txt_address">{{user.user_address}}</textarea></td>
        </tr>
        <tr>
            <td colspan="2" align="center"><input type="submit" name="btn_submit"></td>
        </tr>
    </table>
    </form>
</body>

</html>

{% endblock content %}
